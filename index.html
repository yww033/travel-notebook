<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<title>旅行手帳</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 繪本手帳：旅程選單 → 旅程（上方細標題列＋下方五分頁） */
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --coral:#F2A497; --yellow:#F6D27A; --mizu:#A8D3E6; --green:#B9DAA5;
  --coral-l:#FBE2DC; --yellow-l:#FCF0CC; --mizu-l:#E1F0F6; --green-l:#E5F1DD; --ink-2:#6F6967; --line:#E9E2D6;
  --r:22px; --bw:3px; --nav:68px;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{font-weight:400;margin:0;text-wrap:balance}
:focus-visible{outline:3px dashed var(--coral);outline-offset:2px}
.i{width:20px;height:20px;flex:none;vertical-align:-4px}
.i.s{width:16px;height:16px;vertical-align:-3px}
.i.l{width:28px;height:28px}

.screen{padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen .wrap{max-width:520px;margin:0 auto;display:grid;gap:16px}
#app{padding:calc(58px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#app.editing{padding-top:calc(104px + env(safe-area-inset-top,0px))}
main{max-width:560px;margin:0 auto}

/* login */
.login{min-height:100vh;display:grid;align-content:center}
.login .card{text-align:center;display:grid;gap:14px;justify-items:center;padding:28px 20px}
.login h1{font-size:34px;letter-spacing:.06em}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--paper);padding:10px 22px;font-size:17px;cursor:pointer}
.gbtn.y{background:var(--yellow)}

/* trips */
.thead{display:flex;align-items:center;gap:10px}
.thead h1{font-size:26px;flex:1}
.tripcard{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%}
.tripcard .ic{width:64px;height:64px;border:var(--bw) solid var(--ink);border-radius:20px;display:grid;place-items:center}
.tripcard .ic svg{width:44px;height:44px}
.tripcard h2{font-size:21px}

/* top bar */
.topbar{position:fixed;inset:0 0 auto;z-index:20;background:var(--paper);border-bottom:var(--bw) solid var(--ink);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.topbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;height:34px}
.topbar h1{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.iconbtn{width:36px;height:36px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.iconbtn.on{background:var(--yellow)}
.x-editbar{max-width:560px;margin:8px auto 0;display:flex;align-items:center;gap:8px;background:var(--yellow-l);border:2px dashed var(--ink);border-radius:12px;padding:3px 10px;font-size:13px}
.editbar span{flex:none;display:flex}.editbar span+span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;white-space:nowrap;background:var(--yellow)}

/* bottom nav */
.bnav{position:fixed;inset:auto 0 0;z-index:20;background:var(--paper);border-top:var(--bw) solid var(--ink);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.bnav button{border:0;background:none;display:grid;justify-items:center;gap:1px;padding:4px 0;cursor:pointer;border-radius:16px;font-size:12px}
.bnav button svg{width:28px;height:28px}
.bnav button.on{background:var(--yellow)}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--mizu);font-size:14px;cursor:pointer;display:grid;place-items:center;line-height:1.1}

/* common */
.view{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.view>*,.card,.rows>*,.wxstrip,.tabs,.chips{min-width:0}
.tl,.nearfood,.rows,.lst,.more,.bd,.in{grid-template-columns:minmax(0,1fr)}
.it,.fd,.rowc,.nearfood .r,.lst li{min-width:0}
.screen .wrap{grid-template-columns:minmax(0,1fr)}
.card{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--ink-2)} .small{font-size:13px}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px;line-height:1.3}
.btn:active{transform:translateY(1px)}
.btn.y{background:var(--yellow)} .btn.c{background:var(--coral)} .btn.m{background:var(--mizu)} .btn.g{background:var(--green)}
.btn.s{padding:3px 10px;font-size:13px}
.btn.big{padding:12px 10px;font-size:16px;border-width:var(--bw);border-radius:18px}
.btn.dash{border-style:dashed;background:transparent}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;border:var(--bw) solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:7px 2px;cursor:pointer;font-size:13px;min-width:0}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--yellow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:13px;background:var(--paper);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--mizu)}
.chip.dash{border-style:dashed}
.tag{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
.go.coral{background:var(--coral)} .go.yellow{background:var(--yellow)} .go.mizu{background:var(--mizu)} .go.green{background:var(--green)}
.stamp{border:2px solid var(--ink);background:var(--coral);border-radius:7px;padding:0 5px;font-size:12px;transform:rotate(-6deg);line-height:19px;flex:none}
.warn{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:2px solid var(--ink);background:var(--yellow);border-radius:7px;padding:0 6px;line-height:20px}
.empty{border:2px dashed var(--ink);border-radius:18px;padding:14px;text-align:center;color:var(--ink-2);font-size:14px}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--green)}
.sec-t{display:flex;align-items:center;gap:8px;font-size:17px}
.sec-t .sub{margin-left:auto;font-size:13px;color:var(--ink-2)}
.hide-edit{display:none!important}

/* today */
.strip{padding:0;overflow:hidden}
.strip svg.hero{display:block;width:100%;height:auto;max-height:230px;background:var(--mizu-l);border-bottom:var(--bw) solid var(--ink)}
.strip .body{padding:12px 16px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cd{font-size:15px}.cd b{font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.next .t{font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.next h3{font-size:22px;margin:6px 0 2px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button,.quick label{border:var(--bw) solid var(--ink);border-radius:18px;background:var(--paper);padding:10px 4px;display:grid;justify-items:center;gap:4px;cursor:pointer;font-size:13px}
.quick button svg,.quick label svg{width:30px;height:30px}

/* plan */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none;position:sticky;top:calc(53px + env(safe-area-inset-top,0px));z-index:6;background:var(--paper)}
.editing .tabs{top:calc(91px + env(safe-area-inset-top,0px))}
.tab.drop{background:var(--coral);transform:scale(1.08)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--paper);padding:4px 8px 3px;cursor:pointer;display:grid;justify-items:center;min-width:58px;line-height:1.15}
.tab svg{width:24px;height:24px}
.tab .d{font-size:14px;font-variant-numeric:tabular-nums}
.tab .w{font-size:11px;color:var(--ink-2);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--yellow)}
.tab.istoday{box-shadow:0 0 0 3px var(--coral)}
.dhead{display:flex;gap:10px;align-items:center}
.dhead .ic{width:48px;height:48px;border:var(--bw) solid var(--ink);border-radius:16px;display:grid;place-items:center;flex:none}
.dhead .ic svg{width:36px;height:36px}
.dhead h2{font-size:19px;line-height:1.3}
.dhead .k{font-size:12px;color:var(--ink-2)}
.tip{margin-top:10px;background:var(--yellow-l);border:2px dashed var(--ink);border-radius:14px;padding:6px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:flex-start}
.tip .i{margin-top:2px}
.tip .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.tip.open .t{display:block}
.tl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.it{border:2px solid var(--ink);border-radius:16px;background:var(--paper)}
.it.must{background:var(--coral-l)} .it.done{background:var(--green-l)}
.it .line{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;cursor:pointer;min-height:44px}
.it .tm{font-variant-numeric:tabular-nums;font-size:14px;width:44px;flex:none}
.it .ti{flex:1;min-width:0;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.open .ti{white-space:normal}
.it .flags{display:flex;gap:4px;align-items:center;flex:none}
.handle{flex:none;width:28px;height:28px;display:grid;place-items:center;cursor:grab;touch-action:none;border-radius:8px}
.handle svg{width:14px;height:14px}
.it .more{padding:0 10px 10px 62px;display:grid;gap:6px;font-size:14px}
.it .kr{font-size:13px;color:var(--ink-2)}
.it .note{white-space:pre-wrap}
.ghost{opacity:.35}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center;border:2px solid var(--ink);border-radius:14px;padding:8px;background:var(--mizu-l)}
.flight .ap{font-size:18px;line-height:1.1}.flight .tmx{font-size:14px;font-variant-numeric:tabular-nums}
.dayfoot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fest{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.nearfood{display:grid;gap:6px;margin-top:8px}
.nearfood .r{display:flex;gap:8px;align-items:center;font-size:14px}
.nearfood .r .nmx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ootd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:8px}
.ootd .who{border:2px solid var(--ink);border-radius:16px;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pic{position:relative;aspect-ratio:3/4;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;display:grid;place-items:center}
.upl{border:2px dashed var(--ink);border-radius:10px;padding:5px;text-align:center;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.upl input{display:none}

/* lists */
.rows{display:grid;gap:8px}
.rowc{border:2px solid var(--ink);border-radius:16px;padding:8px 10px;display:flex;gap:10px;align-items:center;background:var(--paper)}
.rowc.ok{background:var(--green-l)}
.rowc .main{flex:1;min-width:0;cursor:pointer}
.rowc .nm{font-size:15px;line-height:1.3}
.rowc .sub{font-size:12px;color:var(--ink-2)}
.ck{width:26px;height:26px;flex:none;accent-color:var(--green);cursor:pointer}
.x{text-decoration:line-through;color:var(--ink-2)}
.lst{list-style:none;margin:0;padding:0;display:grid}
.lst li{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line)}
.lst label{display:flex;gap:10px;align-items:center;cursor:pointer;padding:7px 2px;flex:1;min-width:0}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:12px 0 2px;font-size:14px;color:var(--ink-2)}
.fd{border:2px solid var(--ink);border-radius:16px;background:var(--paper)}
.fd .line{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}
.fd .nm{flex:1;min-width:0;font-size:15px;line-height:1.3}
.fd .nm small{display:block;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .more{padding:0 10px 10px;display:grid;gap:6px;font-size:14px}
.krrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.krrow code{font-family:var(--font);background:var(--mizu-l);border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.fd dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px}
.fd dt{color:var(--ink-2)} .fd dd{margin:0;min-width:0}

/* more */
details.acc{border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--paper)}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:17px;display:flex;align-items:center;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"＋";margin-left:auto}
details.acc[open]>summary::after{content:"－"}
details.acc .bd{padding:0 16px 16px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{border-top:2px solid var(--line);padding:6px 4px;vertical-align:top}
.ko .k{border:2px solid var(--ink);border-radius:16px;padding:8px 12px;display:grid;gap:4px}
.ko .k .kr{font-size:20px;line-height:1.35}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{border:2px solid var(--ink);border-radius:14px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:14px}
.log li .t{flex:1;min-width:0}
.recap-prev{max-width:100%;border:var(--bw) solid var(--ink);border-radius:18px;display:block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(62,58,57,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--paper);border-top:var(--bw) solid var(--ink);border-radius:26px 26px 0 0;
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.sheet h3{font-size:19px}
.f{display:grid;gap:4px;font-size:14px}
.f input,.f select,.f textarea{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--paper);font-size:16px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-2)}
.cb{display:flex;align-items:center;gap:8px;font-size:15px}
.cb input{width:22px;height:22px;accent-color:var(--coral)}
.wk{display:flex;flex-wrap:wrap;gap:6px}
.wk label{border:2px solid var(--ink);border-radius:10px;padding:2px 8px;display:flex;gap:4px;align-items:center;font-size:14px}
.f .wk input{width:auto;padding:0}
.mul{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.mul label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--paper);cursor:pointer;transition:background .15s}
.mul label:has(input:checked){background:#FBEBC0}
.f .mul input{width:22px;height:22px;padding:0;margin:0;accent-color:var(--coral)}
.mul .nm{font-size:15px;line-height:1.35}
.mul .nt{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.daypick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.daypick button{border:var(--bw) solid var(--ink);border-radius:14px;background:var(--paper);padding:6px 2px;cursor:pointer;line-height:1.3;font-size:13px}
.daypick button[disabled]{opacity:.35}
.fxbig{font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1}
.fxin{width:100%;border:var(--bw) solid var(--ink);border-radius:14px;padding:8px 12px;font-size:24px;background:var(--paper);font-variant-numeric:tabular-nums}
.bigcard{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;padding:24px;text-align:center}
.bigcard .kr{font-size:clamp(30px,9vw,54px);line-height:1.3;overflow-wrap:anywhere;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font-size:14px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px}
.toast .btn{color:var(--ink)}

/* photos */
.thumb{width:46px;height:46px;border-radius:10px;border:2px solid var(--ink);object-fit:cover;flex:none;background:var(--line)}
.prow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.prow .ph{position:relative;flex:none}
.prow img{height:110px;width:auto;max-width:170px;min-width:70px;border-radius:12px;border:2px solid var(--ink);object-fit:cover;display:block;cursor:zoom-in;background:var(--line)}
.prow .ph button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);padding:0;display:grid;place-items:center;cursor:pointer}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.album .pic{aspect-ratio:1}
.pic img{cursor:zoom-in}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(40,37,36,.94);display:grid;place-items:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(56px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}

function pickVoice(lang){const l2=lang.slice(0,2);const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(l2));const pf=lsGet('voice:'+l2),pv=pf&&vs.find(v=>v.name===pf);if(pv)return pv;const p=VPREF[l2]||[];return vs.find(v=>p.some(n=>v.name.startsWith(n)))||vs.find(v=>!NOVELTY.test(v.name))||vs[0]}

const WX={};let wxBusy=false,wxAt=0,wxAgain=false,wxSig='';
const locSig=()=>App.meta?Array.from({length:App.meta.days},(_,i)=>locKey(dayLoc(i))).join('|'):'';
async function fetchJSON(u,ms=8000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
const dayLoc=i=>day(i).loc||App.meta.loc||null;
const locKey=l=>l?(+l.lat).toFixed(2)+','+(+l.lon).toFixed(2):'';
async function loadForecast(l){const k='wxf:'+locKey(l),c=lsGet(k);if(c&&Date.now()-c.at<3600e3)return c.d;
  try{const d=await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_min,precipitation_probability_max,precipitation_sum,snowfall_sum,wind_speed_10m_max&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto&forecast_days=16`);lsSet(k,{at:Date.now(),d});return d}catch(e){wxFail=true;return c?c.d:null}}
async function loadClimate(l){const k='wxc3:'+locKey(l)+':'+App.meta.start+':'+App.meta.days,c=lsGet(k);if(c)return c;
  const n=App.meta.days,y0=+App.meta.start.slice(0,4),lim=addDaysISO(todayISO(),-6),acc=Array.from({length:n},()=>({max:[],min:[],rain:0,snow:0,cnt:0}));
  const cand=[];for(let y=y0-1;y>=y0-6&&cand.length<3;y--){const st=y+App.meta.start.slice(4),en=addDaysISO(st,n-1);if(en<=lim)cand.push([y,st,en])}
  const res=[];for(const [y,st,en] of cand){const u=`https://archive-api.open-meteo.com/v1/archive?latitude=${l.lat}&longitude=${l.lon}&start_date=${st}&end_date=${en}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum&timezone=auto`;let r=null;
    for(let t=0;t<3&&!r;t++){if(t)await new Promise(z=>setTimeout(z,1500*t));r=await fetchJSON(u,12000).then(j=>[y,j]).catch(()=>null)}res.push(r)}
  const years=[];res.forEach(r=>{if(!r||!r[1].daily)return;const [y,j]=r,D=j.daily;years.push(y);D.time.forEach((t,i)=>{if(i>=n)return;const a=acc[i];if(D.temperature_2m_max[i]!=null)a.max.push(D.temperature_2m_max[i]);if(D.temperature_2m_min[i]!=null)a.min.push(D.temperature_2m_min[i]);if(D.snowfall_sum[i]>0.2)a.snow++;else if(D.precipitation_sum[i]>1)a.rain++;a.cnt++})});
  if(!years.length)return null;const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const out={years,days:acc.map(a=>({max:avg(a.max),min:avg(a.min),snow:a.snow,rain:a.rain,cnt:a.cnt}))};lsSet(k,out);return out}
async function loadWeather(force){if(!App.meta)return;if(wxBusy){wxAgain=true;return}if(!force&&Date.now()-wxAt<30*6e4&&Object.keys(WX).length)return;wxBusy=true;wxFail=false;const tid=App.tripId;
  const locs={};for(let i=0;i<App.meta.days;i++){const l=dayLoc(i);if(l&&l.lat!=null)locs[locKey(l)]=l}const need=nearTrip();
  let miss=0;try{for(const [k,l] of Object.entries(locs)){const [fc,cl]=await Promise.all([need?loadForecast(l):Promise.resolve(null),loadClimate(l)]);if(App.tripId!==tid)break;WX[k]={fc,cl};if(!cl&&!fc)miss++;if(!dragging)renderAll()}}finally{wxBusy=false;wxSig=locSig();if(wxAgain){wxAgain=false;setTimeout(()=>loadWeather(true),50)}}
  if(App.tripId!==tid)return;wxAt=miss?Date.now()-25*6e4:Date.now();if(!dragging)renderAll()}
function wxFor(i){const l=dayLoc(i);if(!l)return null;const w=WX[locKey(l)];if(!w)return {loc:l,src:null};const iso=slot(i).iso;
  if(w.fc&&w.fc.daily){const D=w.fc.daily,j=D.time.indexOf(iso);if(j>=0&&D.temperature_2m_max[j]!=null)return {loc:l,src:'fc',code:D.weather_code[j],max:D.temperature_2m_max[j],min:D.temperature_2m_min[j],feel:D.apparent_temperature_min[j],pop:D.precipitation_probability_max[j],rain:D.precipitation_sum[j],snow:D.snowfall_sum[j],wind:D.wind_speed_10m_max[j]}}
  if(w.cl&&w.cl.days[i]&&w.cl.days[i].max!=null){const c=w.cl.days[i];return {loc:l,src:'clim',code:c.snow?71:c.rain>1?61:2,max:c.max,min:c.min,feel:null,snowDays:c.snow,rainDays:c.rain,years:w.cl.years}}
  return {loc:l,src:null}}
function wxIcon(code){const c=+code;const n=c===0?'wsun':c<=2?'wpart':c===3?'wcloud':c<=48?'wfog':c<=67||(c>=80&&c<=82)?'wrain':c<=77||c===85||c===86?'wsnow':c>=95?'wthunder':'wcloud';return `<svg viewBox="0 0 40 40" ${SA}>${P[n]}</svg>`}
function wxName(code){const c=+code;return c===0?'晴':c<=2?'晴時多雲':c===3?'陰':c<=48?'霧':c<=57?'毛毛雨':c<=67?'雨':c<=77?'雪':c<=82?'陣雨':c<=86?'陣雪':'雷雨'}
const deg=x=>x==null?'–':Math.round(x)+'°';
function advice(w){if(!w||w.min==null)return '';const t=w.feel!=null?Math.min(w.feel,w.min):w.min-3;const a=[];
  if(t<=-12)a.push('極冷：發熱衣兩層＋毛衣＋長版羽絨，毛帽、手套、圍巾、暖暖包都要');else if(t<=-5)a.push('很冷：發熱衣＋毛衣＋羽絨外套，戴毛帽和手套');else if(t<=2)a.push('冷：發熱衣＋厚外套，圍巾手套帶著');else if(t<=10)a.push('涼：毛衣＋大衣或風衣');else if(t<=20)a.push('舒服：長袖＋薄外套');else a.push('熱：短袖，注意防曬');
  if(w.snow>0.5||w.snowDays>=1)a.push('可能下雪，穿防滑防水的鞋');if(w.pop>=50||(w.rainDays||0)>=2)a.push('帶傘');if(w.wind>=30)a.push('風很大，外套要防風');return a.join('；')}
function wxChip(i){const w=wxFor(i);if(!w||w.src==null)return '';return `<button class="wxchip" data-act="wx" data-i="${i}">${wxIcon(w.code)}${deg(w.min)}/${deg(w.max)}${w.src==='clim'?' 往年':''}</button>`}

const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
function rrect(x,X,Y,W,H,R){x.beginPath();x.roundRect(X,Y,W,H,R);x.lineWidth=6;x.strokeStyle='#3E3A39';x.stroke()}
async function makeRecap(){const out=$('#recapout');if(!out)return;out.innerHTML='<p class="muted">製作中…</p>';try{await document.fonts.load('40px Huninn')}catch(e){}
  const W=1080,PD=60,arr=get('arrive').m,cols=['#A8D3E6','#F6D27A','#B9DAA5','#F2A497'],FN='"Huninn","PingFang TC",sans-serif';const days=[];
  for(let i=0;i<App.meta.days;i++){const c=day(i),o=get('ootd')['d'+i]||{},imgs=[];for(const w of [...people(),'album'])for(const p of (o[w]||[]).slice(0,2)){if(imgs.length>=4)break;const u=await photoURL(p);const im=u&&await loadImg(u);if(im)imgs.push([w,im])}
    const hits=c.items.filter(it=>arr[it.id]);const lines=hits.length?hits.map(it=>`${fmtT(arr[it.id])} 到  ${it.title}`):c.items.filter(it=>it.must).map(it=>`・${it.title}`);days.push({c,imgs,lines:lines.slice(0,8),h:170+(imgs.length?360:0)+Math.max(1,Math.min(lines.length,8))*46})}
  const H=PD+290+days.reduce((s,d)=>s+d.h+40,0)+60,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#FFFCF6';x.fillRect(0,0,W,H);x.fillStyle='#3E3A39';x.font=`76px ${FN}`;x.fillText(App.meta.name,PD,PD+80);x.font=`34px ${FN}`;x.fillStyle='#6F6967';x.fillText(`${App.meta.start} 起 ${App.meta.days} 天 · ${App.meta.sub||''} · ${people().join(' & ')}`,PD,PD+140);{const S=statsObj();x.fillText(`打卡 ${S.arr} 個地方 · 吃了 ${S.ate} 家 · 照片 ${S.ph} 張 · 買到 ${S.buy}/${S.shop} 樣`,PD,PD+190)}let y=PD+240;
  days.forEach((d,i)=>{x.save();x.beginPath();x.roundRect(PD,y,W-PD*2,d.h,36);x.clip();x.fillStyle='#FFFCF6';x.fillRect(PD,y,W-PD*2,d.h);x.fillStyle=cols[i%4];x.fillRect(PD,y,W-PD*2,96);x.restore();rrect(x,PD,y,W-PD*2,d.h,36);
    x.fillStyle='#3E3A39';x.font=`40px ${FN}`;x.fillText(`D${i+1} · ${slotLabel(i)} · ${d.c.area||''}`,PD+30,y+62);x.font=`36px ${FN}`;x.fillText(d.c.theme,PD+30,y+146);let yy=y+176;
    if(d.imgs.length){const n=d.imgs.length,gw=(W-PD*2-60-(n-1)*20)/n,gh=320;d.imgs.forEach(([w,im],k)=>{const gx=PD+30+k*(gw+20);x.save();x.beginPath();x.roundRect(gx,yy,gw,gh,24);x.clip();const s=Math.max(gw/im.width,gh/im.height);x.drawImage(im,gx+(gw-im.width*s)/2,yy+(gh-im.height*s)/2,im.width*s,im.height*s);x.restore();rrect(x,gx,yy,gw,gh,24);x.fillStyle='#FFFCF6';x.beginPath();x.roundRect(gx+12,yy+12,90,44,22);x.fill();x.lineWidth=3;x.stroke();x.fillStyle='#3E3A39';x.font=`26px ${FN}`;x.fillText(w==='album'?'當天':w,gx+26,yy+44)});yy+=gh+40}
    x.font=`30px ${FN}`;x.fillStyle='#3E3A39';(d.lines.length?d.lines:['（這天還沒有打卡）']).forEach((t,k)=>x.fillText(t.length>30?t.slice(0,30)+'…':t,PD+30,yy+k*46+20));y+=d.h+40});
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob){out.innerHTML='<p class="muted">產生失敗</p>';return}const url=URL.createObjectURL(blob);
  out.innerHTML=`<img class="recap-prev" src="${url}" alt="旅行回顧長圖"><div class="btns" style="margin-top:8px"><a class="btn y" href="${url}" download="${esc(App.meta.name)}回顧.png">存到手機</a></div><div class="small muted">手機上也可以長按圖片儲存。</div>`}

const FB_VER='10.12.2';
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('load '+u));document.head.appendChild(s)})}
async function loadFB(){for(const n of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}-compat.js`);
  firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.firestore();try{db.settings({ignoreUndefinedProperties:true})}catch(e){}try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}fb={auth:firebase.auth(),db}}
/* Firestore 不接受「陣列裡面又是陣列」：存之前包成 {__a:[…]}，讀回來再拆開 */
const isPlain=v=>v&&typeof v==='object'&&Object.getPrototypeOf(v)===Object.prototype;
function fsEnc(v){if(Array.isArray(v))return v.map(x=>Array.isArray(x)?{__a:fsEnc(x)}:fsEnc(x));if(isPlain(v)){const o={};for(const k in v)o[k]=fsEnc(v[k]);return o}return v}
function fsDec(v){if(Array.isArray(v))return v.map(fsDec);if(isPlain(v)){const ks=Object.keys(v);if(ks.length===1&&ks[0]==='__a'&&Array.isArray(v.__a))return fsDec(v.__a);const o={};for(const k of ks)o[k]=fsDec(v[k]);return o}return v}
const inApp=()=>/Line\/|Instagram|FBAN|FBAV|MicroMessenger|KAKAOTALK/i.test(navigator.userAgent);

  ${inApp()?'<div class="warn2">你是從 LINE／IG 等 App 裡打開的，Google 不允許在這裡登入。請按右上角「⋯」→「用 Safari／瀏覽器開啟」。</div>':''}
  <button class="btn big y" data-act="login">${ic('star')} 用 Google 帳號登入</button>${msg?`<div class="err">${esc(msg)}</div>`:''}`}
function authMsg(e){const c=(e&&e.code)||'';return c==='auth/unauthorized-domain'?'這個網址還沒加進 Firebase 的「已授權網域」':c==='auth/network-request-failed'?'沒有網路，連上網路後再登入':c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'?'':'登入失敗：'+(c||e&&e.message||'')}
async function doLogin(){if(!fb)return;const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await fb.auth.signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){try{await fb.auth.signInWithRedirect(p)}catch(e2){renderLogin(authMsg(e2))}}else renderLogin(authMsg(e))}}

/* 同步狀態 */
const SYNC={pending:0,last:+(lsGet('lastSync')||0),wasOff:!navigator.onLine};
function track(p){SYNC.pending++;paintSync();return Promise.resolve(p).then(r=>{SYNC.pending=Math.max(0,SYNC.pending-1);if(!SYNC.pending)markSynced();paintSync();return r},e=>{SYNC.pending=Math.max(0,SYNC.pending-1);paintSync();throw e})}
function markSynced(){SYNC.last=Date.now();lsSet('lastSync',SYNC.last)}
function syncState(){if(!navigator.onLine)return SYNC.pending?'wait':'off';return SYNC.pending?'busy':'ok'}
const hm=t=>t?new Date(t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
function paintSync(){const b=$('#syncBtn');document.documentElement.classList.toggle('offline',!navigator.onLine);if(!b)return;b.hidden=App.mode!=='fb';if(b.hidden)return;const st=syncState();b.className='iconbtn syncb '+st;
  const cloud='<path d="M11 29h18a6 6 0 0 0 0-12 8 8 0 0 0-15.5-2.2A6.5 6.5 0 0 0 11 29z"/>';
  const mark=st==='ok'?'<path d="M15.5 22l3 3 6-6"/>':st==='off'?'<path d="M8 8l24 24"/>':st==='busy'?'<g class="spin"><path d="M16 22a4 4 0 0 1 7-2.6"/><path d="M24 22a4 4 0 0 1-7 2.6"/></g>':'<path d="M20 18v5"/><path d="M20 26.5v.5"/>';
  b.innerHTML=`<svg viewBox="0 0 40 40" ${SA}>${cloud}${mark}</svg>${st==='wait'?`<span class="n">${SYNC.pending}</span>`:''}`;
  b.setAttribute('aria-label',{ok:'已同步',busy:'同步中',off:'離線中',wait:'有修改等待上傳'}[st])}
function syncSheet(){const st=syncState();const T={ok:['已同步',`最後更新 ${hm(SYNC.last)}。你和旅伴看到的是同一份。`],busy:['同步中…','正在把修改上傳到雲端。'],off:['離線中',`看到的是 ${hm(SYNC.last)} 的資料。你可以照常查看和修改，修改會先存在手機，有網路時自動上傳。`],wait:[`有 ${SYNC.pending} 筆修改等待上傳`,'沒有網路，修改先存在手機。連上網路後會自動上傳，不用做任何事。']}[st];
  openSheet(`<h3>${T[0]}</h3><p>${T[1]}</p><p class="small muted">導航、天氣、匯率更新需要網路。</p><div class="acts"><button class="btn" data-act="close">知道了</button></div>`)}
addEventListener('online',()=>{paintSync();if(App.mode==='fb'){const w=()=>{if(SYNC.pending)setTimeout(w,800);else{markSynced();paintSync();toast('已同步')}};setTimeout(w,800)}});
addEventListener('offline',()=>{paintSync();if(App.mode==='fb')toast('離線中：可以照常查看和修改，有網路時自動上傳')});

/* 備份：匯出／匯入 */
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(b)});
async function photoData(id){const u=await photoURL(id);if(!u)return '';if(u.startsWith('data:'))return u;try{const b=await (await fetch(u)).blob();const c=await shrink(b,900);return c?c.toDataURL('image/jpeg',.72):await blobToDataURL(b)}catch(e){return ''}}
async function exportBackup(){if(!App.tripId){toast('先打開一個旅程');return}toast('正在準備備份檔…');const docs={};DOC_KEYS.forEach(k=>docs[k]=get(k));
  const ids=[...new Set((JSON.stringify(docs).match(/"ph[a-z0-9]+"/g)||[]).map(x=>x.slice(1,-1)))];const photos={};for(const id of ids){const d=await photoData(id);if(d)photos[id]=d}
  const meta=clone(App.meta);delete meta.members;delete meta.owner;
  const out={app:'trip-notebook',v:1,at:new Date().toISOString(),meta,docs,photos};const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${App.meta.name||'旅程'}_備份_${todayISO().replace(/-/g,'')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast(`已下載備份檔（照片 ${Object.keys(photos).length} 張）`)}
function pickBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;let bk;try{bk=JSON.parse(await f.text())}catch(e){toast('這個檔案讀不出來');return}
  if(!bk||bk.app!=='trip-notebook'||!bk.meta||!bk.docs){toast('這不是旅行手帳的資料檔');return}importSheet(bk)};i.click()}
function importSheet(bk){const n=Object.keys(bk.photos||{}).length;form({title:'匯入資料檔',note:`「${bk.meta.name}」${bk.meta.start||''} 起 ${bk.meta.days||''} 天，照片 ${n} 張。匯入後會新增一個旅程，不會動到現有的旅程。`,
  data:{name:bk.meta.name,members:''},fields:[{k:'name',l:'旅程名稱'},{k:'members',l:'一起編輯的 Google 帳號（用逗號分開，自己會自動加入）',ph:'例如：friend@gmail.com',hide:App.mode!=='fb'}],
  onSave:async v=>{const meta=Object.assign({},bk.meta,{name:v.name||bk.meta.name,members:splitList(v.members||'').map(x=>x.toLowerCase())});const docs={};DOC_KEYS.forEach(k=>docs[k]=bk.docs[k]||blankDocs(meta)[k]);
    let id;try{id=await createTrip(meta,docs)}catch(e){toast('匯入失敗：'+(e.code||e.message||''));return false}
    const ps=Object.entries(bk.photos||{});let k=0;for(const [pid,data] of ps){k++;toast(`上傳照片 ${k}/${ps.length}`);try{if(App.mode==='fb')await track(fb.db.collection('trips').doc(id).collection('photos').doc(pid).set({data,at:Date.now()}));else{const b=await (await fetch(data)).blob();await idb.put(pid,b)}}catch(e){}}
    toast('匯入完成');if(App.mode==='demo'){App.trips=lsGet('trips')||App.trips;openTrip(id)}else{App.autoOpened=true;setTimeout(()=>openTrip(id),400)}}})}

/* 新手教學（光圈指引） */
const TOUR=[
 ['#syncBtn','同步狀態','綠色＝已同步，灰色＝離線中。離線也能看、能改，有網路時會自動上傳。'],
 ['#bnav [data-v="today"]','今天','出發前看待辦和倒數；旅行中看下一站、天氣和這區美食。'],
 ['#bnav [data-v="plan"]','行程','點一站會展開：導航、打卡「已到」、加照片。按住右邊 ≡ 可以拖曳排序。'],
 ['#bnav .plusb','隨手記','拍照、記想吃、想買、想去，或加一筆待辦。'],
 ['#bnav [data-v="eat"]','吃買','用「地區」和「類型」篩選；點店家看推薦（附韓文）和營業時間。'],

let TI=0,TSTEPS=[];
function tourKey(){return 'tour:'+(App.user&&App.user.email||'local')}
async function maybeTour(){if(App.mode!=='fb'||$('#tour')||!App.tripId)return;if(lsGet(tourKey()))return;
  try{const s=await fb.db.collection('users').doc(App.user.uid).get();if(s.exists&&s.data().tourDone){lsSet(tourKey(),1);return}}catch(e){}if(!sheetOpen())startTour()}
function startTour(){closeSheet();show('today',false);window.scrollTo(0,0);TSTEPS=TOUR.filter(([sel])=>{if(!sel)return true;const el=$(sel);return el&&!el.hidden&&el.offsetParent!==null});TI=0;
  const d=document.createElement('div');d.id='tour';d.innerHTML='<div class="ring"></div><div class="tc" role="dialog" aria-live="polite"></div>';document.body.appendChild(d);paintTour()}
function paintTour(){const d=$('#tour');if(!d)return;const [sel,t,txt]=TSTEPS[TI];const ring=d.querySelector('.ring'),tc=d.querySelector('.tc');const el=sel&&$(sel);
  tc.innerHTML=`<div class="dots">${TSTEPS.map((_,k)=>`<i class="${k===TI?'on':''}"></i>`).join('')}</div><h3>${esc(t)}</h3><p>${esc(txt).replace(/\n/g,'<br>')}</p><div class="tb"><button class="btn s" data-tour="skip">略過</button><span class="sp"></span>${TI?'<button class="btn s" data-tour="prev">上一步</button>':''}<button class="btn s y" data-tour="next">${TI===TSTEPS.length-1?'完成':'下一步'}</button></div>`;
  if(el){const r=el.getBoundingClientRect(),p=6;ring.className='ring';Object.assign(ring.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+p*2+'px',height:r.height+p*2+'px'});
    const below=r.top<innerHeight/2;tc.style.top=below?(r.bottom+16)+'px':'';tc.style.bottom=below?'':(innerHeight-r.top+16)+'px'}
  else{ring.className='ring none';ring.removeAttribute('style');tc.style.top='30%';tc.style.bottom=''}}
function endTour(){const d=$('#tour');d&&d.remove();lsSet(tourKey(),1);if(App.mode==='fb'&&App.user&&App.user.uid)fb.db.collection('users').doc(App.user.uid).set({tourDone:true},{merge:true}).catch(()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tour]');if(!b)return;const k=b.dataset.tour;if(k==='skip')return endTour();if(k==='prev'){TI=Math.max(0,TI-1);return paintTour()}if(TI>=TSTEPS.length-1)return endTour();TI++;paintTour()},true);

async function boot(){
