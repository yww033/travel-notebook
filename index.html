<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<title>旅行手帳</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* v30 安靜的繪本：米色紙、粉圓字，像 iOS 一樣用留白和細線分區 */
:root{
  --paper:#FFFCF6; --card:#FFFFFF; --fill:#EFE9DF; --ink:#3E3A39; --ink-2:#8A8380; --line:#EEE7DB;
  --coral:#E98C7C; --coral-l:#FBE2DC; --yellow:#F6D27A; --yellow-l:#FCF0CC; --mizu:#A8D3E6; --mizu-l:#E1F0F6; --green:#7DB46C; --green-l:#E5F1DD;
  --blue:#3F86B0; --red:#D0574A;
  --r:16px; --bw:1px; --nav:58px;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{font-weight:400;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.i{width:20px;height:20px;flex:none;vertical-align:-4px}
.i.s{width:16px;height:16px;vertical-align:-3px}
.i.l{width:28px;height:28px}
.muted{color:var(--ink-2)} .small{font-size:13px}

/* ---------- 版面 ---------- */
.screen{padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen .wrap{max-width:560px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
#app{padding:calc(48px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto}
.view{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);padding-top:6px}
.view>*{min-width:0}

/* 上方標題列 */
.nb{position:fixed;inset:0 0 auto;z-index:20;background:rgba(255,252,246,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(4px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
.nb .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:40px;gap:6px}
.nb h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:56vw;text-align:center}
.nbb{border:0;background:none;color:var(--blue);font-size:16px;padding:6px 8px;cursor:pointer;min-height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nbb.l{justify-self:start;text-align:left}.nbb.r{justify-self:end;text-align:right}
.nbb.plus{font-size:26px;line-height:1;padding:2px 10px}
#netbar{background:var(--fill);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink)}

/* 底部分頁 */
.bnav{position:fixed;inset:auto 0 0;z-index:20;background:rgba(255,252,246,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.bnav button{border:0;background:none;display:grid;justify-items:center;gap:1px;padding:4px 0 2px;cursor:pointer;font-size:11px;color:var(--ink-2);position:relative}
.bnav button svg{width:25px;height:25px}
.bnav button.on{color:var(--ink)}
.bnav button.on svg{stroke-width:2.2}
.bnav .bdot{position:absolute;top:2px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--coral)}

/* 大標題、說明 */
.big{font-size:28px;line-height:1.2}
.subt{color:var(--ink-2);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.subt>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{border:0;background:none;color:var(--blue);font-size:13.5px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;flex:none}
.lnk svg{width:18px;height:18px}
.cap{font-size:12.5px;color:var(--ink-2);margin:6px 4px -6px}

/* 群組列表（iOS 的白色區塊） */
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.grp.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:48px;position:relative;cursor:pointer;min-width:0;background:var(--card);text-decoration:none;color:inherit}
.grp>.row+.row,.grp>.sw+.sw,.grp>.row+.sw,.grp>.sw+.row,.grp>label.row+.row,.grp>.row+label.row{border-top:1px solid var(--line)}
.row .mn{flex:1;min-width:0}
.row .nm{font-size:15.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm.wrap{white-space:normal}
.row .sb{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .tm{width:44px;flex:none;font-size:15px;font-variant-numeric:tabular-nums}
.row .chev{color:#C9C1B5;font-size:20px;line-height:1;flex:none}
.row .val{color:var(--ink-2);font-size:14px;flex:none;max-width:55%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.center{justify-content:center;color:var(--blue)}
.row.red{color:var(--red)}
.row.red .mn,.row.center .mn{text-align:center}
.row.empty1{color:var(--ink-2);font-size:14px;cursor:default}
.row.done .nm{color:var(--ink-2)}
.row .ricon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.row .ricon svg{width:20px;height:20px}
.row .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--fill);border:0}
.thumb.ph0{display:grid;place-items:center;background:var(--yellow-l)}
.note{padding:12px 14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.mustp{font-size:11px;line-height:18px;padding:0 7px;border-radius:7px;background:var(--yellow-l);border:1px solid #E9C766;color:#8A6A12;flex:none;white-space:nowrap}
.okc{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
.wn{width:20px;height:20px;border-radius:50%;background:var(--yellow);font-size:12px;display:grid;place-items:center;flex:none}
.addc{width:32px;height:32px;border-radius:50%;background:var(--yellow);border:0;display:grid;place-items:center;font-size:22px;line-height:1;flex:none;cursor:pointer;padding:0;color:var(--ink)}
.addc.done{background:var(--fill);font-size:14px;color:var(--ink-2)}
.redtxt{color:var(--coral);font-size:13px;flex:none;white-space:nowrap}
.tagx{font-size:11.5px;line-height:18px;padding:0 7px;border-radius:7px;background:var(--fill);flex:none;white-space:nowrap;color:var(--ink-2)}

/* 圓形勾選 */
input.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:1.6px solid #CFC7BB;background:#fff;flex:none;cursor:pointer;margin:0;display:grid;place-items:center}
input.ck:checked{background:var(--green);border-color:var(--green)}
input.ck:checked::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.x{text-decoration:line-through;color:var(--ink-2)}

/* 主要按鈕 */
.bb2{display:flex;gap:10px}
.bb2>*{flex:1;text-align:center;padding:12px 6px;border-radius:14px;font-size:15.5px;border:0;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.bY{background:var(--yellow);color:var(--ink)}.bG{background:var(--fill);color:var(--ink)}.bG.on{background:var(--green-l)}
.bY:active,.bG:active,.row:active{filter:brightness(.97)}

/* 舊元件換成安靜版 */
.btn{border:0;background:var(--fill);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px;line-height:1.3;color:var(--ink)}
.btn:active{filter:brightness(.96)}
.btn.y{background:var(--yellow)} .btn.c{background:var(--coral-l);color:var(--red)} .btn.m{background:var(--mizu-l)} .btn.g{background:var(--green-l)}
.btn.s{padding:4px 11px;font-size:13px}
.btn.big{padding:12px 10px;font-size:16px;border-radius:14px;width:100%}
.btn.dash{background:transparent;color:var(--blue)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 2px;cursor:pointer;font-size:13.5px;min-width:0;border-radius:8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:10px;padding:7px 12px;font-size:14px;background:var(--fill);cursor:pointer;display:inline-flex;align-items:center;gap:4px;line-height:1.2}
.chip small{display:block;font-size:11px;opacity:.7}
.chip.on{background:var(--ink);color:#fff}
.chip.dash{background:transparent;color:var(--blue)}
.chip.col{flex-direction:column;align-items:flex-start;gap:0}
.tag{display:inline-flex;align-items:center;border-radius:7px;padding:0 7px;font-size:11.5px;line-height:19px;white-space:nowrap;background:var(--fill)}
.tag.due,.due{background:var(--coral-l);color:var(--red)}
.go{background:var(--fill)}
.stamp{font-size:11px;line-height:18px;padding:0 7px;border-radius:7px;background:var(--yellow-l);border:1px solid #E9C766;color:#8A6A12;flex:none}
.warn,.warnx{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--yellow-l);border-radius:10px;padding:8px 12px}
.warn{display:inline-flex;padding:2px 8px}
.empty{background:var(--card);border:1px dashed #D9D1C4;border-radius:var(--r);padding:16px;text-align:center;color:var(--ink-2);font-size:14px}
.bar{height:8px;border-radius:999px;overflow:hidden;background:var(--fill)}
.bar i{display:block;height:100%;background:var(--green)}
.sec-t{display:flex;align-items:center;gap:8px;font-size:16px}
.sec-t .sub{margin-left:auto;font-size:13px;color:var(--ink-2)}

/* 行程頁 */
.phead{display:grid;gap:2px}
.dstrip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px;position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:6;background:var(--paper)}
.dstrip::-webkit-scrollbar{display:none}
.dd{flex:none;width:44px;border:0;background:none;border-radius:12px;padding:4px 0 3px;cursor:pointer;display:grid;justify-items:center;line-height:1.1;color:var(--ink-2);font-size:11px}
.dd b{font-weight:400;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;margin:1px 0}
.dd .wi{height:18px;display:grid;place-items:center}
.dd .wi svg{width:18px;height:18px}
.dd.today b{color:var(--coral)}
.dd.on{background:var(--ink);color:#ddd}.dd.on b{color:#fff}
.dd.drop{background:var(--coral);transform:scale(1.08)}
.tipx{background:var(--yellow-l);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.5;cursor:pointer;max-height:calc(3em + 16px);overflow:hidden}
.tipx.open{max-height:none}
.fest{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
/* 左滑 */
.sw{position:relative;overflow:hidden;min-width:0}
.sw>.row{transition:transform .2s ease;touch-action:pan-y;z-index:1}
.sw.drag>.row{transition:none}
.swa{position:absolute;top:0;bottom:0;right:0;display:flex}
.swa button{border:0;color:#fff;font-size:13.5px;width:58px;cursor:pointer;padding:0}
.swa .t1{background:#9B928A}.swa .t2{background:#B5A68A}.swa .b{background:var(--blue)}.swa .r{background:var(--red)}
.sw.open>.row{transform:translateX(-232px)}
.ghost{opacity:.35}
.sortable-drag .row,.sortable-fallback .row{box-shadow:0 6px 20px rgba(0,0,0,.15)}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center;padding:4px 0}
.flight .ap{font-size:18px;line-height:1.1}.flight .tmx{font-size:14px;font-variant-numeric:tabular-nums}

/* 今天 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:4px;min-width:0}
.hero .k{font-size:12.5px;color:var(--ink-2)}
.hero .tmx{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .ttl{font-size:21px;line-height:1.3;cursor:pointer}
.hero .bb2{margin-top:10px}
.hero.c{text-align:center}
.hero.c .tmx{font-size:44px}

/* 匯率 */
.fxbox{padding:14px 16px;display:grid;gap:2px}
.fxl{font-size:12.5px;color:var(--ink-2)}
.fxr{display:flex;align-items:baseline;gap:6px}
.fxs{font-size:26px;color:var(--ink-2)}
.fxr input{border:0;background:none;font-size:36px;width:100%;min-width:0;padding:0;outline:none;font-variant-numeric:tabular-nums}
.fxsep{border-top:1px solid var(--line);margin:8px 0;position:relative;height:0}
.swapb{position:absolute;right:0;top:-17px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px}
.fxo{font-size:36px;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.fxin{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:22px;background:#fff}

/* 收藏 */
.srch{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 12px}
.srch input{border:0;background:none;flex:1;min-width:0;font-size:16px;padding:8px 0;outline:none}
.filtbar{display:flex;gap:14px;flex-wrap:wrap}
.shopg{font-size:12.5px;color:var(--ink-2);margin:6px 4px -6px;display:flex;justify-content:space-between}
.recs{list-style:none;margin:0;padding:0}
.recs li{display:flex;gap:12px;align-items:center;padding:10px 14px;min-width:0}
.recs li+li{border-top:1px solid var(--line)}
.recs li.done .n{color:var(--ink-2)}
.recs .n{flex:1;min-width:0;line-height:1.35}
.recs .n small{display:block;color:var(--ink-2);font-size:12px}
.recs .prow img{height:56px;min-width:40px}
.fhero{width:100%;height:170px;object-fit:cover;border-radius:16px;display:block;background:var(--fill)}

/* 準備清單 */
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;min-height:46px}
.lst li+li{border-top:1px solid var(--line)}
.lst label{display:flex;gap:12px;align-items:center;cursor:pointer;padding:9px 0;flex:1;min-width:0}
.grp-done{border:0;background:none;color:var(--ink-2);font-size:13px;padding:4px;cursor:pointer;justify-self:center}
.faded{opacity:.55}
.rowc{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--card);min-width:0}
.rowc+.rowc{border-top:1px solid var(--line)}
.rowc .main{flex:1;min-width:0;cursor:pointer}
.rowc .nm{font-size:15px;line-height:1.3}
.rowc .sub{font-size:12px;color:var(--ink-2)}
.rows{display:grid;gap:0}
.ko .k{padding:12px 14px;display:grid;gap:4px;cursor:pointer}
.ko .k+.k{border-top:1px solid var(--line)}
.ko .k .kr{font-size:21px;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 14px;background:var(--card)}
.log li+li{border-top:1px solid var(--line)}
.log li .t{flex:1;min-width:0}
.log li.new{background:#FFF8E6}
.log .newtag{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border-radius:7px;background:var(--coral);color:#fff;margin-right:6px;vertical-align:1px}
ul.log{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ovw{list-style:none;margin:8px 0 0;padding:0;display:grid}
.ovw li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.ovw .dt{font-size:13px;line-height:1.25;font-variant-numeric:tabular-nums;cursor:pointer}
.ovw .th{font-size:15px;line-height:1.3;min-width:0;cursor:pointer}
.ovw .th span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovw .th small{display:block;color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdl{font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cdl b{font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stat div{background:var(--fill);border-radius:12px;padding:8px 10px;font-size:13px}
.stat b{display:block;font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.recap-prev{max-width:100%;border-radius:14px;display:block}
.ootd{display:grid;gap:10px}
.ootd .who{display:grid;gap:6px;align-content:start;min-width:0}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pic{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--fill)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pic button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,252,246,.9);cursor:pointer;padding:0;display:grid;place-items:center}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.album .pic{aspect-ratio:1}
.upl{border-radius:10px;padding:8px;text-align:center;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--blue);background:var(--card);border:1px dashed #D9D1C4}
.upl input{display:none}

/* 照片列 */
.prow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.prow .ph{position:relative;flex:none}
.prow img{height:110px;width:auto;max-width:170px;min-width:70px;border-radius:12px;object-fit:cover;display:block;cursor:zoom-in;background:var(--fill)}

async function loadForecast(l){const k='wxf:'+locKey(l),c=lsGet(k);if(c&&Date.now()-c.at<3600e3)return c.d;
  try{const d=await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_min,precipitation_probability_max,precipitation_sum,snowfall_sum,wind_speed_10m_max&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto&forecast_days=16`);lsSet(k,{at:Date.now(),d});return d}catch(e){wxFail=true;return c?c.d:null}}
async function loadClimate(l){const k='wxc3:'+locKey(l)+':'+App.meta.start+':'+App.meta.days,c=lsGet(k);if(c)return c;
  const n=App.meta.days,y0=+App.meta.start.slice(0,4),lim=addDaysISO(todayISO(),-6),acc=Array.from({length:n},()=>({max:[],min:[],rain:0,snow:0,cnt:0}));
  const cand=[];for(let y=y0-1;y>=y0-6&&cand.length<3;y--){const st=y+App.meta.start.slice(4),en=addDaysISO(st,n-1);if(en<=lim)cand.push([y,st,en])}
  const res=[];for(const [y,st,en] of cand){const u=`https://archive-api.open-meteo.com/v1/archive?latitude=${l.lat}&longitude=${l.lon}&start_date=${st}&end_date=${en}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum&timezone=auto`;let r=null;
    for(let t=0;t<3&&!r;t++){if(t)await new Promise(z=>setTimeout(z,1500*t));r=await fetchJSON(u,12000).then(j=>[y,j]).catch(()=>null)}res.push(r)}
  const years=[];res.forEach(r=>{if(!r||!r[1].daily)return;const [y,j]=r,D=j.daily;years.push(y);D.time.forEach((t,i)=>{if(i>=n)return;const a=acc[i];if(D.temperature_2m_max[i]!=null)a.max.push(D.temperature_2m_max[i]);if(D.temperature_2m_min[i]!=null)a.min.push(D.temperature_2m_min[i]);if(D.snowfall_sum[i]>0.2)a.snow++;else if(D.precipitation_sum[i]>1)a.rain++;a.cnt++})});

let TI=0,TSTEPS=[];
function tourKey(){return 'tour:'+(App.user&&App.user.email||'local')}
async function maybeTour(){if(App.mode!=='fb'||$('#tour')||!App.tripId)return;if(lsGet(tourKey()))return;
  try{const s=await fb.db.collection('users').doc(App.user.uid).get();if(s.exists&&s.data().tourDone){lsSet(tourKey(),1);return}}catch(e){}if(!sheetOpen())startTour()}
function startTour(){closeSheet();show('today',false);window.scrollTo(0,0);TSTEPS=TOUR.filter(([sel])=>{if(!sel)return true;const el=$(sel);return el&&!el.hidden&&el.offsetParent!==null});TI=0;
  const d=document.createElement('div');d.id='tour';d.innerHTML='<div class="ring"></div><div class="tc" role="dialog" aria-live="polite"></div>';document.body.appendChild(d);paintTour()}
function paintTour(){const d=$('#tour');if(!d)return;const [sel,t,txt]=TSTEPS[TI];const ring=d.querySelector('.ring'),tc=d.querySelector('.tc');const el=sel&&$(sel);
  tc.innerHTML=`<div class="dots">${TSTEPS.map((_,k)=>`<i class="${k===TI?'on':''}"></i>`).join('')}</div><h3>${esc(t)}</h3><p>${esc(txt).replace(/\n/g,'<br>')}</p><div class="tb"><button class="btn s" data-tour="skip">略過</button><span class="sp"></span>${TI?'<button class="btn s" data-tour="prev">上一步</button>':''}<button class="btn s y" data-tour="next">${TI===TSTEPS.length-1?'完成':'下一步'}</button></div>`;
  if(el){const r=el.getBoundingClientRect(),p=6;ring.className='ring';Object.assign(ring.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+p*2+'px',height:r.height+p*2+'px'});
    const below=r.top<innerHeight/2;tc.style.top=below?(r.bottom+16)+'px':'';tc.style.bottom=below?'':(innerHeight-r.top+16)+'px'}
  else{ring.className='ring none';ring.removeAttribute('style');tc.style.top='30%';tc.style.bottom=''}}
function endTour(){const d=$('#tour');d&&d.remove();lsSet(tourKey(),1);if(App.mode==='fb'&&App.user&&App.user.uid)fb.db.collection('users').doc(App.user.uid).set({tourDone:true},{merge:true}).catch(()=>{})}

/* ---------- 行程 ---------- */
function dayStrip(i){const ti=todayIdx();return `<div class="dstrip" id="tabs">${Array.from({length:App.meta.days},(_,j)=>{const x=slot(j),w=wxFor(j),d=mdNum(x.md);return `<button class="dd${j===i?' on':''}${j===ti?' today':''}" data-act="tab" data-i="${j}" aria-label="${x.md}"><span>${j===0||d==='1'?x.md.split('/')[0]+'月':WD[x.w]}</span><b>${d}</b><span class="wi">${w&&w.src!=null?wxIcon(w.code):''}</span></button>`}).join('')}</div>`}
function wxLink(i,cur){const w=wxFor(i);if(!w||w.src==null)return '';return `<button class="lnk" data-act="wx" data-i="${i}">${wxIcon(w.code)} ${cur!=null?cur:deg(w.min)+'～'+deg(w.max)}${w.src==='clim'?' 往年':''} ›</button>`}
function planRow(it,w,arr){const done=arr[it.id],ws=warns(it,w),sub=[goTxt(it),firstLine(it.note)].filter(Boolean).join('・');
  return `<div class="sw" data-id="${it.id}"><div class="swa"><button class="t1" data-act="tm" data-d="-15" data-id="${it.id}">−15</button><button class="t2" data-act="tm" data-d="15" data-id="${it.id}">+15</button><button class="b" data-act="mvday" data-id="${it.id}">換天</button><button class="r" data-act="delit" data-id="${it.id}">刪除</button></div>
  <div class="row${done?' done':''}" data-act="item" data-id="${it.id}"><span class="tm">${esc(it.t||'--:--')}</span><div class="mn"><div class="nm">${esc(it.title)}</div>${sub?`<div class="sb">${esc(sub)}</div>`:''}</div>${ws.length?'<span class="wn" aria-label="注意">!</span>':''}${done?'<span class="okc">✓</span>':''}${it.must?'<span class="mustp">必去</span>':''}<span class="chev">›</span></div></div>`}
function renderPlan(anim){const el=$('#v-plan');if(!el||!App.meta)return;const pg=STK.plan[STK.plan.length-1];
  if(pg&&pg.k==='item'){const h=itemPage(pg.id);if(h!=null){el.innerHTML=h;hydratePics(el);renderTop();return}STK.plan.pop()}
  if(pg&&pg.k==='planb'){el.innerHTML=planBPage();renderTop();return}

  const i=Math.min(cur,App.meta.days-1);cur=i;const s=slot(i),c=day(i),arr=get('arrive').m;
  const ph=(get('ootd')['d'+i]||{}),nph=Object.values(ph).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0),nf=areaFoods(i).length,pb=c.planB;
  el.innerHTML=`<div class="dhd"><span class="dic" style="background:var(--${['mizu','yellow','green','coral'][i%4]}-l)"><svg viewBox="0 0 40 40" ${SA}>${P[c.icon]||P.cal}</svg></span><div class="phead"><div class="big">${s.md}（${WD[s.w]}）</div><div class="subt"><span>${esc([c.area,c.theme].filter(Boolean).join('・'))}</span>${wxLink(i)}</div></div></div>${dayStrip(i)}
  ${c.variants?`<div class="fest">鱒魚節：${[['hwacheon','華川'],['pyeongchang','平昌']].map(([k,n])=>`<button class="chip${c.fest===k?' on':''}" data-act="fest" data-k="${k}">${n}</button>`).join('')}<span class="muted">還沒決定</span></div>`:''}
  ${c.tip?`<div class="tipx" data-act="tip">💡 ${esc(c.tip)}</div>`:''}
  <div class="grp${anim?' pop':''}" id="tl">${c.items.map(it=>planRow(it,s.w,arr)).join('')||'<div class="row empty1">這天還沒有行程，按右上角「＋」新增</div>'}</div>
  ${c.items.length?'<div class="small muted" style="text-align:center;margin-top:-4px">往左滑可以改時間、換天、刪除・按住可以拖曳排序</div>':''}
  <div class="grp">${rowH({nm:'雨雪備案',val:pb?esc(pb.title):'還沒有',act:'planb'})}${rowH({nm:'這天的照片・OOTD',val:nph?nph+' 張':'',act:'dayph'})}${rowH({nm:'這區美食',val:nf?nf+' 家':'還沒連結地區',act:'dayfood'})}${rowH({nm:'這天的設定',val:'主題、地區、互換、複製',act:'daymenu'})}</div>`;
  hydratePics(el);bindSwipe(el);
  if(sortable){sortable.destroy();sortable=null}
  const tl=$('#tl');if(window.Sortable&&c.items.length&&!isRO()){sortable=Sortable.create(tl,{draggable:'.sw',delay:350,delayOnTouchOnly:true,touchStartThreshold:6,animation:calm()?0:160,ghostClass:'ghost',forceFallback:true,fallbackOnBody:true,filter:'.swa',
    onStart:()=>{dragging=true;dropTab=null},onEnd:e=>{dragging=false;const to=dropTab;dropTab=null;document.querySelectorAll('.dd.drop').forEach(x=>x.classList.remove('drop'));
    if(to!=null&&to!==cur){const p=clone(get('plan'));const [m]=p.days[cur].items.splice(e.oldIndex,1);p.days[to].items.push(m);sortItems(p.days[to]);commit('plan',p,`「${m.title}」從 ${slot(cur).md} 拖到 ${slot(to).md}`);toastUndo(`已移到 ${slot(to).md}`);return}
    if(e.oldIndex===e.newIndex){flushPending();renderPlan(false);return}const p=clone(get('plan'));const d=p.days[cur];const [m]=d.items.splice(e.oldIndex,1);d.items.splice(e.newIndex,0,m);commit('plan',p,`${slot(cur).md}「${m.title}」移到第 ${e.newIndex+1} 個`)}})}
  centerIn($('#tabs'),$('#tabs .dd.on'));renderTop()}
function trackDrag(ev){if(!dragging)return;const t=ev.touches?ev.touches[0]:ev;if(!t)return;const el=document.elementFromPoint(t.clientX,t.clientY);const tab=el&&el.closest&&el.closest('.dd');document.querySelectorAll('.dd.drop').forEach(x=>{if(x!==tab)x.classList.remove('drop')});if(tab&&+tab.dataset.i!==cur){tab.classList.add('drop');dropTab=+tab.dataset.i}else dropTab=null}
/* 左滑 */
function closeSwipes(except){document.querySelectorAll('.sw.open').forEach(s=>{if(s!==except){s.classList.remove('open');s.firstElementChild.nextElementSibling.style.transform=''}})}
function bindSwipe(root){if(isRO())return;root.querySelectorAll('.sw').forEach(sw=>{const r=sw.querySelector('.row');let x0=0,y0=0,dx=0,on=false,dec=null,base=0;
  r.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!e.altKey)return;x0=e.clientX;y0=e.clientY;dx=0;on=true;dec=null;base=sw.classList.contains('open')?-232:0;closeSwipes(sw)});
  r.addEventListener('pointermove',e=>{if(!on||dragging)return;const ddx=e.clientX-x0,ddy=e.clientY-y0;if(dec==null){if(Math.abs(ddx)>8&&Math.abs(ddx)>Math.abs(ddy))dec='h';else if(Math.abs(ddy)>8)dec='v'}if(dec!=='h')return;dx=ddx;sw.classList.add('drag');r.style.transform=`translateX(${Math.min(0,Math.max(-250,base+dx))}px)`;swMoved=true});
  const end=()=>{if(!on)return;on=false;sw.classList.remove('drag');if(dec==='h'){const open=base+dx<-90;sw.classList.toggle('open',open);r.style.transform='';setTimeout(()=>swMoved=false,60)}};
  r.addEventListener('pointerup',end);r.addEventListener('pointercancel',end)})}
document.addEventListener('click',e=>{if(swMoved){e.stopPropagation();e.preventDefault();swMoved=false;return}if(!e.target.closest('.sw.open .swa'))closeSwipes(null)},true);
/* 時間調整＋後面一起移 */
function laterIds(d,id,oldT){const o=toMin(oldT);if(o==null)return [];return d.items.filter(x=>x.id!==id&&toMin(x.t)!=null&&toMin(x.t)>=o).map(x=>x.id)}
function askShift(di,id,oldT,delta,title){if(!delta)return;const ids=laterIds(day(di),id,oldT);if(!ids.length)return;

   <div class="small muted">什麼時候？</div><div class="chips wrap">${SL.map(([n,t])=>`<button class="chip col" data-sl="${t}" data-n="${n}">${n}<small>${t}</small></button>`).join('')}<button class="chip col" data-sl="" data-n="">自己選<small>時間</small></button></div><div class="small" id="swarn" style="color:var(--red)">${warnTxt()}</div>`,sh=>{
    sh.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{di=+b.dataset.di;sh.querySelectorAll('[data-di]').forEach(x=>x.classList.toggle('on',x===b));sh.querySelector('#swarn').textContent=warnTxt()});
    centerIn(sh.querySelector('#sdays'),sh.querySelector('#sdays .on'));
    sh.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{const pre=kind==='food'?{title:o.name,kr:o.kr||'',meal:true,foodId:o.id,note:(o.recs||[]).length?'推薦：'+o.recs.map(r=>(r.star?'★':'')+r.n).join('、'):''}:{title:o.title,kr:o.kr||'',note:o.note||''};
      closeSheet();if(!b.dataset.sl){editItem(null,Object.assign(pre,{_day:di}));return}
      const p=clone(get('plan')),it=Object.assign({id:uid(),go:'walk',must:false},pre,{t:b.dataset.sl});p.days[di].items.push(it);sortItems(p.days[di]);commit('plan',p,`${slot(di).md} ${b.dataset.n} 排進「${name}」`);toastUndo(`已排進 ${slot(di).md} ${b.dataset.n} ${b.dataset.sl}`)})})}
function pickSheet(title,opts,curv,onPick,extra){openSheet(`<div class="shd"><button class="lk" data-act="close">取消</button><h3>${esc(title)}</h3><span></span></div><div class="fg" style="padding:0">${opts.map(([v,n])=>`<div class="row" data-pk="${esc(v)}"><div class="mn"><div class="nm">${esc(n)}</div></div>${String(v)===String(curv)?'<span style="color:var(--blue)">✓</span>':''}</div>`).join('')}</div>${extra||''}`,sh=>sh.querySelectorAll('[data-pk]').forEach(r=>r.onclick=()=>{closeSheet();onPick(r.dataset.pk)}))}
function saveAdd(){if(isRO())return;if(eatTab==='shop')shopEdit(null,true);else if(eatTab==='pool')poolEdit(null,true);else{const a=foodCat??(((day(cur).areas||[])[0])||'all');editFood(null,a,true)}}

/* ---------- 準備清單 ---------- */
function renderPrep(){const el=$('#v-prep');if(!el||!App.meta)return;const L=get('lists'),st=listStats(),m=get('checks').m;
  if(!prepTab||(prepTab!=='book'&&!L.tabs.find(t=>t.id===prepTab)))prepTab=(L.tabs[0]||{id:'book'}).id;
  const tabs=[...L.tabs.map(t=>[t.id,t.name]),['book','預約']];
  let h=`<div class="seg">${tabs.map(([k,n])=>`<button class="${prepTab===k?'on':''}" data-act="preptab" data-k="${k}">${esc(n)} ${st[k]?st[k].done+'/'+st[k].all:''}</button>`).join('')}</div>`;
  const doneTog=(g,n,label)=>`<button class="grp-done" data-act="donetog" data-g="${g}">${openDoneG.has(g)?'▾':'▸'} ${label} ${n} 項</button>`;
  if(prepTab==='book'){const B=get('book').items,und=B.filter(b=>!b.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')),dn=B.filter(b=>b.done);
    const row=b=>`<div class="row"><input class="ck" type="checkbox" data-book="${b.id}" ${b.done?'checked':''} aria-label="已預約">${b.photos&&b.photos[0]?imgTag(b.photos[0],'確認信',`class="thumb" data-gal="book:${b.id}" data-k="0"`):''}<div class="mn" data-act="bookedit" data-id="${b.id}"><div class="nm${b.done?' x':''}">${esc(b.name)}</div><div class="sb">${esc([b.date,b.time&&'時間 '+b.time,b.price&&'金額 '+b.price,firstLine(b.note)].filter(Boolean).join('・'))}</div></div>${b.due&&!b.done?`<span class="redtxt">${esc(fmtDue(b.due))} 前</span>`:''}<span class="chev">›</span></div>`;
    h+=`<div class="small muted">勾＝已預約。點項目可以填時間、金額、確認信截圖。</div><div class="grp">${und.map(row).join('')||'<div class="row empty1">全部都預約好了</div>'}</div>${dn.length?doneTog('book',dn.length,'已預約')+(openDoneG.has('book')?`<div class="grp faded">${dn.map(row).join('')}</div>`:''):''}`}
  else{const t=L.tabs.find(x=>x.id===prepTab);let G='';const li=x=>`<li><label><input class="ck" type="checkbox" data-chk="${x.id}" data-t="${esc(x.t)}" ${m[x.id]?'checked':''}><span class="${m[x.id]?'x':''}">${esc(x.t)}</span></label>${isRO()?'':`<button class="lnk" data-act="itemedit" data-g="${G}" data-id="${x.id}" aria-label="編輯" style="color:#C9C1B5;font-size:18px">›</button>`}</li>`;
    h+=t.groups.map(g=>{G=g.id;const und=g.items.filter(x=>!m[x.id]),dn=g.items.filter(x=>m[x.id]);
      return `<div class="shopg"><span>${esc(g.name)}</span><span>${dn.length}/${g.items.length}${isRO()?'':` <button class="lnk" data-act="grpedit" data-g="${g.id}" style="padding:0 0 0 6px">編輯</button>`}</span></div><div class="grp"><ul class="lst">${und.map(li).join('')}${isRO()?'':`<li><button class="lnk" data-act="itemadd" data-g="${g.id}">＋ 加一項</button></li>`}</ul></div>${dn.length?doneTog(g.id,dn.length,'已完成')+(openDoneG.has(g.id)?`<div class="grp faded"><ul class="lst">${dn.map(li).join('')}</ul></div>`:''):''}`}).join('')||'<div class="empty">這頁還沒有分組</div>';
    if(!isRO())h+=`<div class="filtbar" style="justify-content:center"><button class="lnk" data-act="grpadd">＋ 新增分組</button><button class="lnk" data-act="ltabedit">改分頁名稱</button><button class="lnk" data-act="ltabadd">＋ 新增分頁</button></div>`}
  el.innerHTML=h;hydratePics(el);if(view==='prep')renderTop()}

/* ---------- 旅程列表 ---------- */
function renderTrips(){const box=$('#triplist');if(!box)return;const hd=$('#s-trips .thead');if(hd)hd.innerHTML=`<h1>我的旅程</h1>${App.isAdmin?'<button class="nbb r" data-act="access">管理帳號</button>':''}`;
  $('#whoami').innerHTML=App.mode==='fb'?`${esc(App.user.email)}　<button class="lnk" data-act="logout">登出</button>`:esc(CAN_SAVE?(location.protocol==='file:'?'本機預覽版：資料只存在這台電腦的瀏覽器。':'資料存在這台裝置的瀏覽器。'):'注意：這個瀏覽器不允許存資料。');
  const n=Date.now(),L=App.trips.map(t=>({t,se:tripSE(t)}));const dur=L.filter(x=>x.se[0]<=n&&n<=x.se[1]),up=L.filter(x=>x.se[0]>n).sort((a,b)=>a.se[0]-b.se[0]),past=L.filter(x=>x.se[1]<n).sort((a,b)=>b.se[1]-a.se[1]);
  const card=({t,se})=>{const st=se[0]>n?`${Math.floor((se[0]-n)/864e5)} 天`:n<=se[1]?`旅行中・第 ${Math.floor((n-se[0])/864e5)+1} 天`:'';const ro=App.mode==='fb'&&!(t.members||[]).includes(myEmail());
    return `<div class="row" data-act="open" data-id="${esc(t.id)}"><span class="tic"><svg viewBox="0 0 40 40" ${SA}>${P[t.icon]||(t.hero==='trout'?P.fish:P.suitcase)}</svg></span><div class="mn"><div class="nm">${esc(t.name)}</div><div class="sb">${esc(t.start||'')} 起 ${t.days||''} 天${t.sub?'・'+esc(t.sub):''}${ro?'・只能看':''}</div></div>${st?`<span class="val">${st}</span>`:''}<span class="chev">›</span></div>`};
  const now=dur.concat(up);
  box.innerHTML=(now.length?`<div class="grp">${now.map(card).join('')}</div>`:'')+(past.length?`<div class="cap">已結束</div><div class="grp">${past.map(card).join('')}</div>`:'')+
   (!App.trips.length?(App.mode==='fb'&&!App.tripsLoaded?'<div class="empty">讀取中…</div>':`<div class="empty">${App.mode==='fb'?`目前登入的是 ${esc((App.user&&App.user.email)||'')}，這個帳號還沒有旅程。<br>第一次使用：按下面的「匯入資料檔」。<br>被邀請的人：請對方到「旅程設定」加入這個 Gmail。`:'還沒有旅程。'}</div>`):'')+
   `<div class="grp">${rowH({nm:'＋ 新增旅程',act:'newtrip',cls:'center',right:''})}${rowH({nm:'匯入資料檔（.json）',act:'importbk',cls:'center',right:''})}${IS_PUBLIC||App.mode==='fb'||App.trips.some(t=>t.hero==='trout')?'':rowH({nm:'匯入「鱒魚遊戲」行程',act:'importtrout',cls:'center',right:''})}</div>`}

/* ---------- 用備份檔更新這個旅程 ---------- */
function pickOverwrite(){if(App.mode==='fb'&&!canManage()){toast('只有建立旅程的人或管理員可以用備份檔更新');return}const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;let bk;try{bk=JSON.parse(await f.text())}catch(e){toast('這個檔案讀不出來');return}if(!bk||bk.app!=='trip-notebook'||!bk.docs){toast('這不是旅行手帳的資料檔');return}
    const np=Object.keys(bk.photos||{}).length,keys=DOC_KEYS.filter(k=>bk.docs[k]);
    openSheet(`<div class="shd"><button class="lk" data-act="close">取消</button><h3>用備份檔更新</h3><span></span></div><div class="grp">${rowH({nm:esc(f.name),sb:`「${esc((bk.meta||{}).name||'')}」・${keys.length} 類資料・照片 ${np} 張`,wrap:1})}</div>
     <p>會用檔案內容<b>取代</b>「${esc(App.meta.name)}」的行程、美食、清單等內容。成員和權限不變。</p><p class="small muted">目前的內容會被蓋掉。不放心的話，先到「匯出備份檔」存一份。行程可以在修改紀錄復原。</p>
     <button class="bY" id="owgo" style="border:0;border-radius:14px;padding:13px;font-size:16px;cursor:pointer">確定更新</button>`,sh=>sh.querySelector('#owgo').onclick=async()=>{closeSheet();await applyOverwrite(bk)})};i.click()}
async function applyOverwrite(bk){if(roBlock())return;const prevPlan=clone(get('plan'));toast('更新中…');
  DOC_KEYS.forEach(k=>{if(bk.docs[k])writeDoc(k,clone(bk.docs[k]))});
  if(bk.meta){const keep=['members','viewers','owner','createdAt','name'];const nm=Object.assign({},App.meta);Object.entries(bk.meta).forEach(([k,v])=>{if(!keep.includes(k))nm[k]=v});saveMeta(nm,'用備份檔更新旅程設定')}
  addLog('plan',prevPlan,'用備份檔更新整個旅程');
  const ps=Object.entries(bk.photos||{});let n=0;for(const [pid,data] of ps){n++;if(n%5===1)toast(`上傳照片 ${n}/${ps.length}`);try{if(App.mode==='fb')await track(fb.db.collection('trips').doc(App.tripId).collection('photos').doc(pid).set({data,at:Date.now()}));else{const b=await (await fetch(data)).blob();await idb.put(pid,b)}PHOTO[pid]=data}catch(e){}}
  Object.keys(STK).forEach(k=>STK[k]=[]);renderAll();toastUndo('已用備份檔更新')}

/* ---------- 用 AI 更新 ---------- */
let AIC=null;
function aiPrompt(){const m=App.meta;const days=get('plan').days.map((d,i)=>{const s=slot(i);return `${s.md}（${WD[s.w]}）${d.area||''}｜${d.theme||''}\n`+(d.items||[]).map(it=>`- [${it.id}] ${it.t||'--:--'} ${it.title}${it.note?'｜'+firstLine(it.note).slice(0,40):''}`).join('\n')}).join('\n');
  return `【旅行手帳 AI 更新】
你是旅行行程助理。請依照我在最後貼的「會議紀錄／修改需求」，修改下面這份行程。
只回覆一個程式碼區塊，第一行寫 TRIP-UPDATE，第二行開始是 JSON，格式如下：
{"changes":[
 {"op":"add","day":"2/28","t":"19:30","title":"KANIZA 螃蟹吃到飽","note":"晚餐"},
 {"op":"edit","id":"行程的 id","t":"10:05","title":"要改才寫","note":"要改才寫"},
 {"op":"move","id":"行程的 id","day":"2/27","t":"要改時間才寫"},
 {"op":"del","id":"行程的 id"},
 {"op":"todo","text":"要加到待辦清單的事"}
]}
規則：
1. 只列出要改的地方，沒提到的不要動。
2. edit／move／del 一定要用下面行程裡方括號的 id。
3. 時間用 24 小時制 HH:MM；日期用 M/D（例如 2/28）。
4. note 寫短一點（30 字內），用繁體中文。
5. 不確定、看不懂、或不是行程的事，寫成 todo，不要猜。

目前行程：${m.name}，${m.start} 起 ${m.days} 天
${days}

---
會議紀錄／修改需求（貼在下面）：
`}
function aiPage(){return `<div class="small muted">把會議紀錄交給 AI，它會告訴手帳要改哪裡。改動要你勾過才會生效，改錯也能在修改紀錄復原。</div>
  <div class="cap">第 1 步</div><div class="grp">${rowH({left:'<span class="addc" style="width:28px;height:28px;font-size:15px">1</span>',nm:'複製給 AI',sb:'包含目前行程和給 AI 的說明',act:'aicopy',right:'<span class="lnk">複製</span>'})}</div>
  <div class="cap">第 2 步</div><div class="grp">${rowH({left:'<span class="addc" style="width:28px;height:28px;font-size:15px;background:var(--fill)">2</span>',nm:'打開任何 AI App 貼上',sb:'',wrap:1})}<div class="note" style="padding-top:0;color:var(--ink-2);font-size:13px">ChatGPT、Gemini、Claude 免費版都可以。長按輸入框貼上，接著貼你的會議紀錄（或直接打字，例如「2/26 雪上摩托車拿掉」），送出。</div>${''}</div>
  <div class="cap">第 3 步</div><div class="grp"><div class="row" style="display:grid;gap:8px;cursor:default"><div class="nm wrap">把 AI 回的整段文字複製，貼在這裡</div><textarea id="aiin" class="aibox" placeholder="TRIP-UPDATE&#10;{&quot;changes&quot;:[ … ]}"></textarea><button class="bY" data-act="aiparse" style="border:0;border-radius:12px;padding:11px;font-size:15.5px;cursor:pointer">看 AI 要改什麼</button></div></div>
  <div id="aiout"></div>`}
function dayByMd(s){s=String(s||'').trim().replace(/^0/,'').replace(/\/0/,'/');for(let i=0;i<App.meta.days;i++)if(slot(i).md===s)return i;return -1}
function findAny(id){const d=get('plan').days;for(let i=0;i<d.length;i++){const it=(d[i].items||[]).find(x=>x.id===id);if(it)return [i,it]}return [-1,null]}
function aiParse(){const txt=($('#aiin')||{}).value||'';const a=txt.indexOf('{'),b=txt.lastIndexOf('}');let j;try{j=JSON.parse(txt.slice(a,b+1))}catch(e){$('#aiout').innerHTML='<div class="warnx">讀不懂這段文字。請確認有複製到 AI 回答裡「TRIP-UPDATE」那一整段。</div>';return}
  const ch=(j.changes||j||[]);if(!Array.isArray(ch)||!ch.length){$('#aiout').innerHTML='<div class="warnx">AI 沒有列出任何改動</div>';return}
  AIC=ch.map(c=>{const op=c.op;let txt='',ok=true;if(op==='add'){const di=dayByMd(c.day);ok=di>=0&&!!c.title;txt=`${c.day} 新增 ${c.t||''} ${c.title||''}`}
    else if(op==='edit'||op==='move'||op==='del'){const [di,it]=findAny(c.id);ok=!!it;const nm=it?it.title:'（找不到這個行程）';
      if(op==='del')txt=`${di>=0?slot(di).md:''} 刪除「${nm}」`;else if(op==='move'){ok=ok&&dayByMd(c.day)>=0;txt=`「${nm}」從 ${di>=0?slot(di).md:''} 移到 ${c.day}${c.t?' '+c.t:''}`}
      else{const parts=[c.t&&it&&c.t!==it.t?`時間 ${it.t||'--'} → ${c.t}`:'',c.title&&it&&c.title!==it.title?`改名「${c.title}」`:'',c.note&&it&&c.note!==it.note?`備註：${c.note}`:'',c.kr&&it&&c.kr!==it.kr?`當地名稱：${c.kr}`:''].filter(Boolean);txt=`${di>=0?slot(di).md:''}「${nm}」`+(parts.length?' '+parts.join('、'):'（已經是這樣，不用改）');if(!parts.length)ok=false}}
    else if(op==='todo'){txt=`待辦：${c.text||''}`;ok=!!c.text}else{ok=false;txt='看不懂的改動'}return {c,txt,ok}});
  $('#aiout').innerHTML=`<div class="cap">AI 建議了 ${AIC.length} 個改動，勾要套用的</div><div class="grp">${AIC.map((x,k)=>`<label class="row"${x.ok?'':' style="opacity:.5"'}><input class="ck" type="checkbox" data-aik="${k}" ${x.ok?'checked':'disabled'}><div class="mn"><div class="nm wrap">${esc(x.txt)}</div>${x.ok?'':`<div class="sb">${/不用改/.test(x.txt)?'不會套用':'找不到對應的行程或日期，不會套用'}</div>`}</div></label>`).join('')}</div><button class="bY" data-act="aiapply" style="border:0;border-radius:14px;padding:13px;font-size:16px;cursor:pointer;width:100%">套用勾選的改動</button>`}
function aiApply(){if(!AIC||roBlock())return;const pick=[...document.querySelectorAll('[data-aik]:checked')].map(x=>AIC[+x.dataset.aik]).filter(x=>x.ok);if(!pick.length){toast('沒有勾選任何改動');return}
  const p=clone(get('plan'));const todos=[];const touched=new Set();const find=id=>{for(let i=0;i<p.days.length;i++){const k=p.days[i].items.findIndex(x=>x.id===id);if(k>=0)return [i,k]}return [-1,-1]};
  pick.forEach(({c})=>{if(c.op==='add'){const di=dayByMd(c.day);p.days[di].items.push({id:uid(),t:c.t||'',title:c.title,go:'walk',kr:c.kr||'',note:c.note||'',must:false});touched.add(di)}
    else if(c.op==='edit'){const [i,k]=find(c.id);if(i<0)return;const it=p.days[i].items[k];['t','title','note','kr'].forEach(f=>{if(c[f]!=null&&c[f]!=='')it[f]=c[f]});touched.add(i)}
    else if(c.op==='move'){const [i,k]=find(c.id);const to=dayByMd(c.day);if(i<0||to<0)return;const [m]=p.days[i].items.splice(k,1);if(c.t)m.t=c.t;p.days[to].items.push(m);touched.add(to)}
    else if(c.op==='del'){const [i,k]=find(c.id);if(i<0)return;p.days[i].items.splice(k,1)}
    else if(c.op==='todo')todos.push(c.text)});
  touched.forEach(i=>sortItems(p.days[i]));const nPlan=pick.length-todos.length;
  if(todos.length){const L=clone(get('lists')),t=L.tabs[0];if(t){if(!t.groups.length)t.groups.push({id:uid(),name:'待辦',items:[]});const g=t.groups[0];todos.forEach(x=>g.items.push({id:uid(),t:x}));commit('lists',L,`用 AI 加了 ${todos.length} 件待辦`)}}
  if(nPlan)commit('plan',p,`用 AI 更新行程：${nPlan} 個改動`);
  AIC=null;const o=$('#aiout');if(o)o.innerHTML='';const ai=$('#aiin');if(ai)ai.value='';toastUndo(`已套用 ${pick.length} 個改動`)}

function maybeTour(){}
function syncSheet(){toast(syncLine())}
function gearSheet(){openIn('tools',null)}

boot();
setInterval(()=>{if(App.tripId){renderTop();if(view==='today')renderToday()}},60000);
